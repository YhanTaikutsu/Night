const para="As the sky begins to be covered by the stars, I wonder beneath the moonlight how many miles lie between us, and yet how close you feel in this stillness. And for every hour that passes in this night fall, my heart's desire to be with you grows stronger. Thus, as I stand in this room filled with the thought of your presence, I look towards the moon to hope that time will be faster in order to be with you. The breeze outside and the leaves falling into the ground may be the only noise outside. However, this heart of mine is loudly screaming for your affection and presence. And with your presence, I can finally fulfill these desire of mine - the desire to make you laugh, smile, and capture that unparalleled beauty of yours. For every time that those smile of you shows, unbeknownst to me, that moment of our bond suddenly becomes embedded to my heart that will forever be replayed for each time I look for you. Hence, as the night starts to switch places with the daylight, may the night wrap you with love, care, and the unwavering desire of mine to making our connection stronger, a safe place, and filled with endless fondness.";
